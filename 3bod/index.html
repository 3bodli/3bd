<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3bod</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
<header><div class="logo">3bod</div><div class="hr"><span id="who"></span><button class="pill" id="lang">العربية</button></div></header>
<nav role="tablist">
<button role="tab" data-t="calc" data-i="tCalc" aria-selected="true"></button>
<button role="tab" data-t="send" data-i="tSend" aria-selected="false"></button>
<button role="tab" data-t="track" data-i="tTrack" aria-selected="false"></button>
<button role="tab" data-t="acct" data-i="tAcct" aria-selected="false"></button>
</nav>

<section id="calc" class="on">
<h2 data-i="cH"></h2>
<p class="sub" data-i="cSub"></p>
<label for="c-amt" data-i="lAmt"></label>
<input id="c-amt" type="number" inputmode="decimal" min="1" value="200">
<label for="c-cur" data-i="lCur"></label>
<select id="c-cur"><option value="USD" data-i="usd"></option><option value="SYP" data-i="syp"></option></select>
<div class="calc" id="c-out"></div>
<p class="note" data-i="demo"></p>
<button class="btn" data-go="send" data-i="sendNow"></button>
</section>

<section id="send">
<h2 data-i="sH"></h2>
<p class="sub" id="s-sub"></p>
<div id="s-form" hidden>
<label for="s-name" data-i="lName"></label><input id="s-name" autocomplete="off">
<label for="s-phone" data-i="lPhone"></label><input id="s-phone" class="ltr" type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
<label for="s-sham" data-i="lSham"></label><input id="s-sham" class="ltr" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
<label for="s-amt" data-i="lAmt"></label><input id="s-amt" type="number" inputmode="decimal" min="1" value="200">
<label for="s-cur" data-i="lCur"></label>
<select id="s-cur"><option value="USD" data-i="usd"></option><option value="SYP" data-i="syp"></option></select>
<p class="sub" style="margin:10px 0 0"><span class="tag">Sham Cash</span> <span data-i="onlyShamNote"></span></p>
<div class="calc" id="s-out"></div>
<button class="btn" id="s-go" data-i="confirm"></button>
</div>
<div id="s-needs"><button class="btn" data-go="acct" data-i="signInUp"></button></div>
<div id="s-msg"></div>
</section>

<section id="track">
<h2 data-i="tH"></h2>
<p class="sub" data-i="tSub"></p>
<label for="t-code" data-i="lCode"></label>
<input id="t-code" class="ltr" placeholder="3BD-XXXXXX" style="text-transform:uppercase">
<button class="btn" id="t-go" data-i="trackBtn"></button>
<div id="t-res"></div>
<div class="list" id="t-list"></div>
</section>

<section id="acct">
<div id="a-in">
<h2 id="a-title"></h2>
<p class="sub" data-i="aSub"></p>
<div id="a-nameBox"><label for="a-name" data-i="lFull"></label><input id="a-name" autocomplete="name"></div>
<label for="a-mail" data-i="lMail"></label><input id="a-mail" type="email" class="ltr" autocomplete="email">
<label for="a-pass" data-i="lPass"></label><input id="a-pass" type="password" class="ltr" autocomplete="new-password">
<button class="btn" id="a-go"></button>
<p class="sub" style="margin-top:14px"><span id="a-q"></span> <button class="link" id="a-sw"></button></p>
<div id="a-msg"></div>
</div>
<div id="a-out" hidden>
<h2><span data-i="hello"></span> <span id="a-hi"></span></h2>
<p class="sub" data-i="loggedIn"></p>
<button class="btn" data-go="send" data-i="sendTransfer"></button>
<button class="btn ghost" id="a-exit" data-i="logout"></button>
</div>
</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
